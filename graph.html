<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Knowledge Graph - DragonKael Lab</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #graph {
      width: 100%;
      height: 80vh;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.04);
    }

    .node text {
      pointer-events: none;
      font-size: 12px;
      fill: #e6eef8;
    }
  </style>
</head>

<body>
  <header>
    <h1>Knowledge Graph</h1>
  </header>
  <main class="container">
    <div id="graph"></div>
    <p>Nodes are connected when they share tags. Click node to open item.</p>
  </main>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/graph.js"></script>
</body>

</html>
