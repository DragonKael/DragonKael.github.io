<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>DragonKael Research Lab</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <h1>DragonKael Research Lab</h1>
      <p>Systems Engineering • Research • Experiments</p>
    </div>
    <div class="top-controls"><a href="/graph.html">Grafo</a> | <a href="/timeline.html">Timeline</a> | <button
        id="theme-toggle">Modo oscuro</button></div>
  </header>

  <main class="container">
    <section class="controls">
      <input id="global-search" type="search" placeholder="Buscar por título, descripción, tag..." />
      <div id="filter-bar" class="filters"></div>
    </section>

    <section>
      <h2>Destacados</h2>
      <div id="featured-row" class="cards-row"></div>
    </section>

    <section class="grid" id="sections-grid">
      <div class="section">
        <h3>Research</h3>
        <ul id="research-list" class="item-list"></ul>
      </div>
      <div class="section">
        <h3>Projects</h3>
        <ul id="projects-list" class="item-list"></ul>
      </div>
      <div class="section">
        <h3>Experiments</h3>
        <ul id="experiments-list" class="item-list"></ul>
      </div>
      <div class="section">
        <h3>Notes</h3>
        <ul id="notes-list" class="item-list"></ul>
      </div>
      <div class="section">
        <h3>Papers</h3>
        <ul id="papers-list" class="item-list"></ul>
      </div>
      <div class="section">
        <h3>Infographics</h3>
        <ul id="infographics-list" class="item-list"></ul>
      </div>
    </section>

    <section>
      <h2>Resultados</h2>
      <ul id="search-results" class="search-results"></ul>
    </section>
  </main>

  <script src="config/lab-config.js"></script>
  <script src="js/repo-indexer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
  <script src="js/search.js"></script>

</body>

</html>
